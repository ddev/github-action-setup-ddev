name: 'Setup DDEV in GitHub Workflows'
description: 'Set up your GitHub Actions workflow with DDEV'
author: 'Jonas Eberle and DDEV contributors'

inputs:
  ddevDir:
    description: 'Path to your DDEV project. This path needs to contain the .ddev/ directory.'
    required: false
    default: '.'

  autostart:
    description: 'Starts your DDEV project immediately.'
    required: false
    default: 'true'

  version:
    description: 'Install a specific DDEV version. Example: 1.24.0'
    required: false
    default: 'latest'

  installScriptUrl:
    description: 'URL to the DDEV installation script'
    required: true
    default: 'https://ddev.com/install.sh'

  token:
    description: 'GitHub token used to download the DDEV HEAD build (version: head) directly from GitHub instead of through nightly.link'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Download DDEV install script
      shell: bash
      env:
        INSTALL_SCRIPT_URL: ${{ inputs.installScriptUrl }}
      run: |
        curl -fsSL --retry 3 --retry-max-time 60 --retry-connrefused -o /tmp/install_ddev.sh "${INSTALL_SCRIPT_URL}"

    - name: Install DDEV
      shell: bash
      env:
        DDEV_VERSION: ${{ inputs.version }}
      run: |
        if [[ "${DDEV_VERSION}" == 'latest' ]]; then
          VERSION_ARG=""
          echo "Installing latest stable DDEV version"
        elif [[ "${DDEV_VERSION}" == 'head' ]]; then
          # HEAD is installed by replacing the stable binaries in the next step
          VERSION_ARG=""
          echo "Installing latest stable DDEV version, to be replaced with the HEAD build"
        else
          VERSION_ARG="v${DDEV_VERSION}"
          echo "Installing DDEV version: ${VERSION_ARG}"
        fi

        # Make installation script executable
        chmod +x /tmp/install_ddev.sh

        /tmp/install_ddev.sh ${VERSION_ARG}

    - name: Replace DDEV with the HEAD build
      shell: bash
      if: inputs.version == 'head'
      env:
        # With a token, download-ddev gets the build from GitHub directly,
        # and uses nightly.link only if that fails
        DDEV_GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        head_dir="${RUNNER_TEMP}/ddev-head"
        ddev utility download-ddev --head --output "${head_dir}"
        # Overwrite the stable binaries in place, so ddev and ddev-hostname stay
        # a matching pair wherever they are called from
        ddev_dir="$(dirname "$(command -v ddev)")"
        sudo install -m 0755 "${head_dir}/ddev" "${head_dir}/ddev-hostname" "${ddev_dir}/"
        rm -rf "${head_dir}"
        ddev --version

    - name: Configure DDEV
      shell: bash
      run: |
        ddev config global --instrumentation-opt-in=false --omit-containers=ddev-ssh-agent

    - name: Start DDEV project
      shell: bash
      working-directory: ${{ inputs.ddevDir }}
      if: inputs.autostart == 'true'
      run: |
        ddev start

branding:
  icon: 'cpu'
  color: yellow
