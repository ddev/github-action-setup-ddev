name: 'Setup DDEV in GitHub Workflows'
description: 'Set up your GitHub Actions workflow with DDEV'
author: 'Jonas Eberle and DDEV contributors'

inputs:
  ddevDir:
    description: 'Path to your DDEV project. This path needs to contain the .ddev/ directory.'
    required: false
    default: '.'

  autostart:
    description: 'Starts your DDEV project immediately.'
    required: false
    default: 'true'

  version:
    description: 'Install a specific DDEV version. Example: 1.24.0'
    required: false
    default: 'latest'

  installScriptUrl:
    description: 'URL to the DDEV installation script'
    required: true
    default: 'https://ddev.com/install.sh'

  cacheDependencies:
    description: 'Cache Composer, npm and Yarn downloads between workflow runs, keyed on the lock files.'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'Whether cacheDependencies restored an exact match for the lock files.'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Download DDEV install script
      shell: bash
      run: |
        if [[ '${{ inputs.version }}' == 'head' && '${{ inputs.installScriptUrl }}' == 'https://ddev.com/install.sh' ]]; then
          SCRIPT_URL="https://raw.githubusercontent.com/ddev/ddev/main/scripts/install_ddev_head.sh"
          echo "Using head version install script: ${SCRIPT_URL}"
        else
          SCRIPT_URL="${{ inputs.installScriptUrl }}"
        fi
        curl -fsSL --retry 3 --retry-max-time 60 --retry-connrefused -o /tmp/install_ddev.sh "${SCRIPT_URL}"

    - name: Install DDEV
      shell: bash
      run: |
        if [[ '${{ inputs.version }}' == 'latest' ]]; then
          VERSION_ARG=""
          echo "Installing latest stable DDEV version"
        elif [[ '${{ inputs.version }}' == 'head' ]]; then
          VERSION_ARG=""
          echo "Installing DDEV HEAD version"
        else
          VERSION_ARG="v${{ inputs.version }}"
          echo "Installing DDEV version: ${VERSION_ARG}"
        fi
        
        # Make installation script executable
        chmod +x /tmp/install_ddev.sh
        
        /tmp/install_ddev.sh ${VERSION_ARG}
        ddev config global --instrumentation-opt-in=false --omit-containers=ddev-ssh-agent

    # DDEV's own caches live in a Docker volume that actions/cache can't reach,
    # so point the package managers at a directory inside the project instead.
    - name: Point package caches at the project
      if: inputs.cacheDependencies == 'true'
      shell: bash
      working-directory: ${{ inputs.ddevDir }}
      run: |
        mkdir -p .ddev/.setup-ddev-cache
        cat > .ddev/config.zz-setup-ddev-cache.yaml <<'EOF'
        web_environment:
          - COMPOSER_CACHE_DIR=/var/www/html/.ddev/.setup-ddev-cache/composer
          - npm_config_cache=/var/www/html/.ddev/.setup-ddev-cache/npm
          - YARN_CACHE_FOLDER=/var/www/html/.ddev/.setup-ddev-cache/yarn
        EOF

    - name: Cache dependencies
      id: cache
      if: inputs.cacheDependencies == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.ddevDir }}/.ddev/.setup-ddev-cache
        key: setup-ddev-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/composer.lock', inputs.ddevDir), format('{0}/package-lock.json', inputs.ddevDir), format('{0}/yarn.lock', inputs.ddevDir)) }}
        restore-keys: setup-ddev-deps-${{ runner.os }}-${{ runner.arch }}-

    - name: Start DDEV project
      shell: bash
      working-directory: ${{ inputs.ddevDir }}
      if: inputs.autostart == 'true'
      run: |
        ddev start

branding:
  icon: 'cpu'
  color: yellow
