name: tests

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: Enable remote debugging session
        type: boolean
        required: false
        default: false
  schedule:
    - cron: 0 0 * * *

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        version: ['latest', 'head', '1.24.8']
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          ddevDir: tests/fixtures/ddevProj1
          autostart: false
          version: ${{ matrix.version }}

      - name: Setup upterm session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true

      - name: ddev version
        run: |
          ddev --version
          if [[ ${{ matrix.version }} == '1.24.8' ]]; then
            test "$(ddev --version)" == 'ddev version v1.24.8'
          else
            test "$(ddev --version)" != 'ddev version v1.24.8'
          fi

      - name: ddev stopped
        run: |
          cd tests/fixtures/ddevProj1
          test '"stopped"' = "$(ddev describe --json-output | jq '.raw.status')"

      - name: start ddev
        run: |
          cd tests/fixtures/ddevProj1
          ddev start --json-output --skip-confirmation

      - name: Mailpit reachable
        run: curl --silent --dump-header - --output /dev/null https://setup-ddev-proj1.ddev.site:8026

      - name: "index.html: expected output"
        run: test 'index.html test output' = "$(curl --silent https://setup-ddev-proj1.ddev.site)"

      - name: restart ddev with project_tld=test
        run: |
          cd tests/fixtures/ddevProj1
          ddev config --project-tld=test
          ddev restart --json-output --skip-confirmation

      - name: Mailpit reachable
        run: curl --silent --dump-header - --output /dev/null https://setup-ddev-proj1.test:8026

      - name: "index.html: expected output"
        run: test 'index.html test output' = "$(curl --silent https://setup-ddev-proj1.test)"

  cache-save:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./
        with:
          ddevDir: tests/fixtures/ddevProj2
          cacheDependencies: true

      - name: Install dependencies to fill the cache
        working-directory: tests/fixtures/ddevProj2
        run: |
          ddev composer install
          ddev npm ci

  cache-restore:
    needs: cache-save
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./
        id: ddev
        with:
          ddevDir: tests/fixtures/ddevProj2
          cacheDependencies: true

      - name: Cache restored
        env:
          CACHE_HIT: ${{ steps.ddev.outputs.cache-hit }}
        run: test "$CACHE_HIT" = 'true'

      - name: Install dependencies without network access
        working-directory: tests/fixtures/ddevProj2
        run: |
          ddev exec 'COMPOSER_DISABLE_NETWORK=1 composer install'
          ddev npm ci --offline
